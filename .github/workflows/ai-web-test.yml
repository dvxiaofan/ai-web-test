name: AI Web Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # This repository workflow validates the reusable tool itself. A target
      # project's workflow should add its own app startup and approved plan.
      # Use npm ci after committing the generated package-lock.json; install is
      # kept here so the initial template also works before that lockfile exists.
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-web-test-evidence
          path: |
            coverage/
            test-results/

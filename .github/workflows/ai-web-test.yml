name: AI Web Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # E2E fixture exercises AI scenario planning, so the provider key must be present.
      CODEBUDDY_API_KEY: ${{ secrets.CODEBUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # Pin Node via .nvmrc (committed in Batch 0.1) for reproducible installs.
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tests (unit + Chromium fixture E2E)
        env:
          AI_WEB_TEST_E2E: "1"
        run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-web-test-evidence
          path: |
            coverage/
            test-results/
            .ai-web-test/
            .tmp-e2e-runs/
